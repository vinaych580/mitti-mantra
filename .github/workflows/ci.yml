name: CI

# Phase 0 safety net (docs/superpowers/specs/2026-11-11-phase0-stabilise-design.md, 0.7).
# Every push runs the fast Python set and all frontend checks; pull requests
# also run the full Python suite, including the model-loading tests.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node unit tests
        run: node --test tests/*.cjs
      - name: Syntax-check every frontend script
        run: find frontend -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Service worker VERSION bumped when precached files change
        run: node scripts/ci/check_sw_version.cjs "${BASE_REF}"
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/master' }}
      - name: Translatable strings exist in hi and te
        run: node scripts/ci/check_i18n.cjs "${BASE_REF}"
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/master' }}

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 3.12 matches the venv the committed model artifacts were tested in;
      # scikit-learn is pinned to the version they were pickled with.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The test suite needs the production dependencies, the test client, and
      # pandas (dev-only, but tests/test_ml_pipeline_isolation.py imports
      # ml/evaluate_models.py, which needs it at import time). torch/torchvision
      # in requirements-dev.txt are for offline disease-model training and are
      # never imported by tests.
      - name: Install
        run: pip install -r requirements.txt pytest httpx "pandas>=2.0.0" "pyarrow>=15"
      # The serving store (gitignored, a release asset) carries the district record
      # the Phase 2 ranking reads; without it the tests would check a different app
      # from the one that deploys. Same script and checksum check as the Vercel build.
      - name: Fetch serving store
        run: node scripts/fetch_serving_store.cjs --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fast tests
        if: github.event_name == 'push'
        run: pytest -q tests -m "not slow" -p no:cacheprovider
      - name: Full suite
        if: github.event_name == 'pull_request'
        run: pytest -q tests --durations=15 -p no:cacheprovider
