name: E2E

# Phase 4 acceptance in a real browser (tests/e2e): every tool reachable from
# the new sections, old deep links, one tool's five states, and axe on the
# landing page, dashboard and planner at 375 px and desktop.
#
# Non-blocking for now: the job never fails a push or a pull request
# (continue-on-error), because adding Playwright as a dev dependency is the
# owner's decision. Read the result in the job log and the uploaded report.
# Nothing here touches the Vercel build, which installs no npm packages.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the app
        run: pip install -r requirements.txt
      # Same store the deploy and the Python tests use, so the browser sees the
      # district records production serves.
      - name: Fetch serving store
        run: node scripts/fetch_serving_store.cjs --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No lockfile in the repo (the frontend has no build step); the versions
      # are pinned exactly in package.json.
      - name: Install Playwright
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test -c tests/e2e
        env:
          PYTHON: python
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
